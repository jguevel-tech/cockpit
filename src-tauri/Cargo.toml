[package]
name = "cockpit"
version = "0.54.3"
edition = "2021"
description = "Desktop Docker orchestration app"

[lib]
name = "cockpit_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "cockpit"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
sysinfo = "0.30"
# Identifiants stables entre machines : les identifiants entiers de SQLite sont locaux,
# donc deux postes donneraient le meme a deux choses differentes.
uuid = { version = "1", features = ["v4"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json", "multipart"] }
chrono = "0.4"
portable-pty = "0.9"
base64 = "0.22"
# PKCE : l'empreinte du verificateur, et de l'alea pris au systeme. Les deux etaient deja dans
# l'arbre en transitif (rustls les tire), les declarer ne change donc rien au poids du binaire.
sha2 = "0.10"
getrandom = "0.2"
ignore = "0.4"
# Capture audio des reunions, DANS notre processus : le meme code sur les trois systemes,
# et plus aucun programme externe (`pw-record`/`parecord` avant aout 2026).
# La feature `pulseaudio` est ce qui rend le son SYSTEME captable sous Linux : le host ALSA
# (celui par defaut) ne sait pas lire un monitor, et la feature `pipewire` tirerait des
# liaisons vers libpipewire — donc une bibliotheque C de plus dans l'AppImage, exactement
# la famille de pannes de la libwayland. Le host PulseAudio, lui, reimplemente le protocole
# en Rust pur, et couvre les machines PipeWire (via pipewire-pulse) comme PulseAudio.
# ATTENTION : sous Linux, cpal depend de toute facon d'`alsa-sys` (host par defaut, pas
# derriere une feature) — d'ou `libasound2-dev` au build.
cpal = { version = "0.18", features = ["pulseaudio"] }
futures = "0.3"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
regex = "1.13.1"
# Suppression de fichiers de l'onglet Fichiers : corbeille SYSTEME, jamais un rm definitif.
# Cross-platform (freedesktop/macOS/Windows) — coherent avec l'objectif de portabilite.
trash = "5"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"
# Emulateur de terminal (grille de caracteres, curseur, ecran alternatif, historique).
# Version EPINGLEE a l'exact : la crate ne promet aucune stabilite d'API (0.x, extraite
# d'Alacritty). Ce sur quoi terminal/ecran/ s'appuie est liste en tete de
# terminal/ecran/mod.rs — a relire avant toute montee de version.
# `default-features = false` retire serde : on ne serialise jamais la grille en JSON,
# le redessin passe par des octets ANSI.
alacritty_terminal = { version = "=0.26.0", default-features = false }
# Largeur d'affichage d'un caractere (CJK, emoji). MEME crate et MEME version que celle
# qu'utilise alacritty_terminal : le redessin doit compter les colonnes exactement comme
# l'emulateur, sinon une ligne contenant du CJK ressort decalee d'une colonne.
unicode-width = "0.2"
# Le tuyau entre l'application et le service de terminaux : socket de domaine Unix et
# tuyau nomme Windows derriere la MEME interface (`terminal/service/`). Sans `async` :
# le service est fait de threads bloquants, un par PTY, ce qui suffit pour une dizaine de
# terminaux et evite d'embarquer un second runtime a cote de celui de Tauri.
interprocess = { version = "2.4.3", default-features = false }

# Deux appels, tous deux indispensables au service de terminaux :
# `geteuid` (refuser de parler a un socket qui n'est pas le notre) et `setsid` (detacher
# le service de la session de l'application, pour qu'il lui survive). `interprocess`
# expose deja des types libc dans son API publique (`PeerCreds::euid`), la dependance est
# donc directe plutot que cachee.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Profil optimise pour l'iteration : thin LTO + codegen parallele.
# Le fat LTO (lto = true, codegen-units = 1) gagnait ~2-5% de perf/taille
# mais re-linkait tout le monde a chaque build (~plusieurs minutes).
[profile.release]
strip = true
lto = "thin"
codegen-units = 16

# Un essai d'integration est un crate a part : il ne voit que l'API publique et CES
# dependances-ci. Les memes que celles du programme, redeclarees, faute de quoi le fichier
# d'essai ne compile pas.
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
