name: CI

# Nom lisible dans la liste des runs : sans ca, GitHub affiche le message de commit et
# deux workflows sur le meme commit paraissent etre le meme run lance deux fois.
run-name: CI · ${{ github.ref_name }}

# Verification continue de `main`. Ne publie RIEN : seul release.yml, declenche par un
# tag v*, cree une release. L'interet est d'attraper une regression avant le tag, pour
# qu'une release ne se casse jamais sur un test qu'on aurait pu voir venir.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Un seul run par branche : un nouveau push annule le precedent, encore en cours.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Un commit de release est deja verifie par release.yml, qui lance les memes `npm run
    # check` et `cargo test` avant de builder. Comme le tag et `main` sont pousses ensemble
    # (`git push --follow-tags`), les deux workflows demarraient sur le meme commit et
    # recompilaient Rust en parallele pour rien. On saute donc les commits de release.
    # La condition sur pull_request est necessaire : `head_commit` est nul sur cet evenement.
    if: >-
      github.event_name == 'pull_request' ||
      !startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependances systeme Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          # MEME cle que release.yml : sans `shared-key`, rust-cache inclut le nom du job
          # dans la cle et les deux workflows entretiennent deux caches separes — la CI
          # chauffait un cache que la release n'utilisait jamais. `main` etant la branche
          # par defaut, le cache qu'elle produit est accessible depuis les tags.
          shared-key: tauri

      - run: npm ci

      - name: Verification des types frontend
        run: npm run check

      # Meme profil que la release, pour que les deux workflows partagent le cache Rust
      # au lieu d'en maintenir deux (un debug, un release).
      - name: Tests Rust
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      # Verifie que le script d'installation reste du sh POSIX valide : il est execute
      # par `curl | sh` chez les utilisateurs, une erreur de syntaxe y serait invisible
      # jusqu'a ce que quelqu'un tente d'installer.
      - name: Syntaxe du script d'installation
        run: sh -n scripts/install.sh
