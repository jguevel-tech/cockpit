name: Release

run-name: Release · ${{ github.ref_name }}

# Se declenche sur un tag v* pousse par un humain (le script de release cree le tag,
# il ne le pousse jamais). C'est le seul chemin de publication.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # necessaire pour creer la Release et y attacher les artefacts

jobs:
  release:
    # Matrice Linux + macOS + Windows : les trois jobs publient sur la MEME release (meme
    # tagName), et tauri-action FUSIONNE latest.json plateforme par plateforme — l'updater de
    # chaque OS y trouve son artefact. fail-fast: false pour qu'un echec macOS ou Windows
    # (plateformes non testables en local) ne prive jamais les utilisateurs Linux de leur
    # version.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage
          # `app` en plus du dmg : l'artefact de MISE A JOUR macOS (.app.tar.gz + .sig)
          # est genere depuis le bundle app — sans lui, latest.json n'a pas d'entree
          # darwin et l'updater integre ne fonctionne pas (constate sur la v0.25.0).
          - os: macos-latest # Apple Silicon (aarch64)
            bundles: app,dmg
          # NSIS et pas MSI. MSI passe par WiX, s'installe PAR MACHINE donc reclame
          # l'elevation a chaque mise a jour, et double les fichiers a signer. NSIS
          # s'installe par utilisateur et c'est le format que l'updater Tauri v2 sait
          # remplacer tout seul. Rien a installer sur le runner : WebView2 est deja present
          # sur les images `windows-*`, et les etapes `apt-get` sont conditionnees a Linux.
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    # Le build Rust a cache froid prend ~80 min ; au-dela c'est un blocage, pas une
    # lenteur. Sans ce plafond GitHub attend SIX HEURES avant de tuer le job.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Dependances systeme Tauri (Linux)
        if: runner.os == 'Linux'
        # 15 min suffisent largement (~40 s en temps normal). Le plafond est la parce que
        # cette etape s'est figee SIX HEURES sur la v0.31.0 : `unattended-upgrades` tient le
        # verrou dpkg au demarrage du runner et apt attend indefiniment. D'ou aussi
        # `Lock::Timeout` (apt rend la main au lieu d'attendre) et les trois essais.
        timeout-minutes: 15
        run: |
          set -eux
          # Coupe le service qui tient le verrou, sinon on ne fait que l'attendre.
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          export DEBIAN_FRONTEND=noninteractive
          apt_reessai() {
            for essai in 1 2 3; do
              if sudo apt-get -o DPkg::Lock::Timeout=120 "$@"; then return 0; fi
              echo "apt-get $1 : echec (essai $essai), nouvelle tentative dans 15 s"
              sleep 15
            done
            return 1
          }
          apt_reessai update
          # `libasound2-dev` : cpal (capture audio des reunions) depend d'`alsa-sys` sans
          # condition sous Linux — le host ALSA n'est pas derriere une feature, meme quand
          # on ne se sert que du host PulseAudio. Sans ce paquet, `alsa-sys` echoue sur
          # « Package alsa was not found in the pkg-config search path ».
          apt_reessai install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Sauve le cache meme quand le job echoue : sans ca, chaque correctif de CI
          # repartait d'une compilation Rust complete (~11 min perdues par iteration).
          cache-on-failure: true
          # Cle fixe et non derivee du nom du job (rust-cache y ajoute l'OS de lui-meme) :
          # le cache est reutilise d'une release a la suivante tant que Cargo.lock ne bouge
          # pas. C'est ce qui fait passer le run de ~12 min a ~7 min.
          shared-key: tauri

      - run: npm ci

      # Les garde-fous du projet tournent aussi en CI : une release ne doit jamais
      # partir depuis un etat qui ne passe pas les verifications.
      - name: Verification des types frontend
        run: npm run check

      # `--release` est volontaire : sans lui, cargo compile TOUT une premiere fois en debug
      # pour les tests, puis tauri-action recompile TOUT en release pour le bundle — deux
      # profils, aucun artefact partage. Mesure sur le run 31691474888 : 2 min 45 de tests
      # + 8 min 44 de build = ~12 min. En release, les deux etapes partagent le meme
      # target/release. Aucun `debug_assert!` dans le code, donc rien n'est perdu.
      - name: Tests Rust
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      # Les notes de version viennent du CHANGELOG.md, pas du message de commit : c'est ce
      # texte que les utilisateurs lisent dans le modal de mise a jour. On extrait la section
      # de la version taguee, delimitee par le titre suivant.
      - name: Extraire les notes du CHANGELOG
        id: notes
        # `shell: bash` explicite : le shell par defaut du runner Windows est PowerShell, qui
        # ne connait ni `${VAR#prefixe}` ni les heredocs. Git Bash est installe sur les images
        # `windows-*`, donc la MEME etape sert aux trois plateformes.
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::Aucune section [$VERSION] trouvee dans CHANGELOG.md — release interrompue."
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Construit le bundle de la plateforme, le signe (signature updater minisign — la
      # signature Apple/notarisation demanderait un compte developpeur), publie sur la
      # Release et fusionne latest.json.
      - name: Build, signature et publication
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # La cle a ete generee SANS mot de passe : un seul secret a gerer, et rien de
          # sensible n'a besoin de transiter ailleurs que du fichier vers GitHub.
          # La variable doit exister quand meme (chaine vide), sinon la CLI la reclame.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Remontee des erreurs : l'adresse du serveur de suivi est figee DANS le binaire a
          # la compilation (`option_env!`), pas ecrite dans le depot — il est public, et
          # l'adresse d'un serveur prive n'a pas a y etre indexee. Secrets absents = la
          # remontee est simplement inactive, ce qui est le cas des builds locaux.
          COCKPIT_REPORT_URL: ${{ secrets.COCKPIT_REPORT_URL }}
          COCKPIT_REPORT_SITE: ${{ secrets.COCKPIT_REPORT_SITE }}
          # Serveur maison sans certificat : le HTTP est assume ici, explicitement.
          COCKPIT_REPORT_ALLOW_HTTP: ${{ secrets.COCKPIT_REPORT_ALLOW_HTTP }}
        with:
          # `bundle.active` est volontairement absent de tauri.conf.json : l'y mettre a true
          # ECRASE le --no-bundle de la CLI et casserait le build de dev local (il tenterait
          # de signer sans cle privee). Le bundle est donc force ici, explicitement.
          args: -b ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Cockpit ${{ github.ref_name }}
          # Section du CHANGELOG.md extraite a l'etape precedente : c'est exactement ce
          # texte que les utilisateurs voient dans le modal de mise a jour.
          releaseBody: ${{ steps.notes.outputs.body }}
          # BROUILLON, volontairement. Les deux jobs publient sur la meme release et
          # tauri-action fusionne `latest.json` plateforme par plateforme : le premier job
          # a finir exposait donc un `latest.json` SANS l'autre plateforme. Un utilisateur
          # Linux qui verifiait pendant cette fenetre recevait « None of the fallback
          # platforms [...] were found » — constate en usage. Le brouillon n'est pas servi
          # par `releases/latest`, donc personne ne voit un fichier incomplet ; le job
          # `publier` ci-dessous leve le brouillon quand la version Linux est bien la.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  # Leve le brouillon UNE FOIS la version Linux verifiee. Separe du build pour s'executer
  # meme si le job macOS a echoue (plateforme secondaire) : un echec la-bas ne doit pas
  # priver les utilisateurs Linux de leur mise a jour.
  publier:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verifier que la version Linux est publiable, puis lever le brouillon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Passage par l'API et non par `gh release view` : un brouillon n'est PAS
          # accessible par son tag (l'API rend 404), il faut le retrouver dans la liste.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" > /tmp/releases.json
          python3 - <<'EOF' > /tmp/brouillon.env
          import json, os, sys
          tag = os.environ["TAG"]
          releases = json.load(open("/tmp/releases.json"))
          cibles = [r for r in releases if r["tag_name"] == tag]
          if not cibles:
              sys.exit(f"::error::aucune release pour le tag {tag}")
          if len(cibles) > 1:
              sys.exit(f"::error::{len(cibles)} releases portent le tag {tag} — publication manuelle requise")
          r = cibles[0]
          noms = sorted(a["name"] for a in r["assets"])
          print(f"# artefacts : {noms}", file=sys.stderr)

          # Sans AppImage il n'y a rien a livrer a nos utilisateurs : mieux vaut laisser le
          # brouillon en place qu'annoncer une version qu'ils ne peuvent pas installer.
          if not any(n.endswith(".AppImage") for n in noms):
              sys.exit("::error::aucune AppImage : la release reste en brouillon")

          maj = [a for a in r["assets"] if a["name"] == "latest.json"]
          if not maj:
              sys.exit("::error::latest.json absent : la release reste en brouillon")
          print(f"RELEASE_ID={r['id']}")
          print(f"ASSET_ID={maj[0]['id']}")
          print(f"DEJA_PUBLIEE={'0' if r['draft'] else '1'}")
          EOF
          cat /tmp/brouillon.env >> "$GITHUB_ENV"
          . /tmp/brouillon.env

          # `latest.json` est ce que lit l'updater : sans entree Linux, l'application affiche
          # une erreur au lieu d'une mise a jour. C'est le bug qu'on ferme ici.
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > /tmp/latest.json
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("/tmp/latest.json"))
          plateformes = sorted(d.get("platforms", {}))
          print("version:", d.get("version"), "| plateformes:", plateformes)
          if not any(p.startswith("linux-") for p in plateformes):
              sys.exit("::error::latest.json sans entree Linux : la release reste en brouillon")
          EOF

          if [ "$DEJA_PUBLIEE" = "1" ]; then
            echo "Release $TAG deja publiee, rien a faire."
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false -f make_latest=true > /dev/null
            echo "Release $TAG publiee : les utilisateurs peuvent mettre a jour."
          fi

          # Une plateforme absente ne doit PAS passer inapercue. Sur la v0.32.0, le job macOS
          # avait echoue : `latest.json` est sorti avec les seules entrees Linux, tous les
          # utilisateurs mac ont ete coupes des mises a jour, et ce job est reste VERT. Personne
          # n'a ete averti.
          # On publie quand meme — les systemes qui ont reussi ne doivent pas attendre l'autre —
          # puis on fait ECHOUER le run en nommant ce qui manque. Ajouter une plateforme a la
          # matrice = l'ajouter ici, sinon son absence redevient silencieuse.
          PLATEFORMES_ATTENDUES="linux- darwin- windows-" python3 - <<'EOF'
          import json, os, sys
          plateformes = sorted(json.load(open("/tmp/latest.json")).get("platforms", {}))
          attendues = os.environ["PLATEFORMES_ATTENDUES"].split()
          manquantes = [a for a in attendues if not any(p.startswith(a) for p in plateformes)]
          if manquantes:
              noms = ", ".join(m.rstrip("-") for m in manquantes)
              print(f"::error::release publiee mais INCOMPLETE — aucune entree {noms} dans "
                    f"latest.json. Ces utilisateurs ne recevront pas la mise a jour. "
                    f"Reparer par `gh run rerun <id> --failed` : tauri-action retrouve la "
                    f"release et y fusionne la plateforme manquante.")
              sys.exit(1)
          print(f"latest.json complet : {plateformes}")
          EOF
