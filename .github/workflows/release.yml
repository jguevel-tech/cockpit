name: Release

run-name: Release · ${{ github.ref_name }}

# Se declenche sur un tag v* pousse par un humain (le script de release cree le tag,
# il ne le pousse jamais). C'est le seul chemin de publication.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # necessaire pour creer la Release et y attacher les artefacts

jobs:
  # **LA RELEASE SE CREE UNE SEULE FOIS, ICI, AVANT TOUTE CONSTRUCTION.** Chaque job de la
  # matrice demandait a electron-builder de publier ; quand deux d'entre eux finissaient dans
  # la meme seconde, chacun constatait « la release n'existe pas » et en creait une. Sur la
  # v0.59.2 : DEUX brouillons pour le meme tag, l'AppImage Linux perdue entre les deux, et le
  # job de publication qui refuse (a juste titre) de trancher. Les trois jobs se contentent
  # desormais de deposer leurs fichiers dans un brouillon qui existe deja.
  preparer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.creer.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Creer le brouillon de release et y poser les notes
        id: creer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          export VERSION
          # Les notes viennent du CHANGELOG : c'est ce texte que les gens lisent dans le modal
          # de mise a jour ET sur la page de la release. electron-builder, lui, cree une
          # release SANS notes : les 0.59.0 et 0.59.1 sont sorties avec une page blanche.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ -z "$(tr -d '[:space:]' < /tmp/notes.md)" ]; then
            echo "::error::Aucune section [$VERSION] trouvee dans CHANGELOG.md — release interrompue."
            exit 1
          fi

          # Un brouillon n'est pas accessible par son tag : on le cherche dans la liste. Cette
          # etape doit pouvoir se rejouer (relance d'un run), donc elle REUTILISE ce qui existe.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" > /tmp/releases.json
          COMPTE=$(python3 -c "
          import json, os
          tag = os.environ['TAG']
          print(len([r for r in json.load(open('/tmp/releases.json')) if r['tag_name'] == tag]))
          ")
          if [ "$COMPTE" -gt 1 ]; then
            echo "::error::$COMPTE releases portent deja le tag $TAG — menage manuel requis"
            exit 1
          fi
          # **ON NE RECHERCHE PAS UNE RELEASE QU'ON VIENT DE CREER : ON GARDE CE QUE LA
          # CREATION A RENDU.** Mesure du 2026-09-10 : six secondes apres un
          # `gh release create --draft`, la liste ne contenait toujours pas le brouillon.
          # La creation par l'API, elle, rend l'objet cree avec son identifiant.
          # Le corps passe par un fichier JSON : les notes sont multilignes et accentuees,
          # ce qu'un `-f body=...` en ligne de commande abime.
          if [ "$COMPTE" = "0" ]; then
            python3 -c "
          import json, os
          print(json.dumps({'tag_name': os.environ['TAG'], 'name': os.environ['VERSION'],
                            'draft': True, 'body': open('/tmp/notes.md').read()}))
            " > /tmp/creation.json
            ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" --input /tmp/creation.json --jq .id)
          else
            ID=$(python3 -c "
          import json, os
          tag = os.environ['TAG']
          print([r['id'] for r in json.load(open('/tmp/releases.json')) if r['tag_name'] == tag][0])
            ")
            python3 -c "
          import json
          print(json.dumps({'body': open('/tmp/notes.md').read()}))
            " > /tmp/corps.json
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" --input /tmp/corps.json > /dev/null
          fi
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::la creation de la release n'a rendu aucun identifiant pour $TAG"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "brouillon $ID pret pour $TAG"

  release:
    needs: preparer
    # Matrice Linux + macOS + Windows. `fail-fast: false` pour qu'un echec macOS ou Windows
    # ne prive jamais les utilisateurs Linux de leur version.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest # Apple Silicon (aarch64)
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    # Le build Rust a cache froid est long ; au-dela c'est un blocage, pas une lenteur.
    # Sans ce plafond GitHub attend SIX HEURES avant de tuer le job.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # **BEAUCOUP MOINS DE DEPENDANCES QU'AVANT, ET C'EST LE POINT DE TOUTE LA MIGRATION.**
      # Le backend ne reclame plus webkit2gtk, gtk-3, rsvg2 ni patchelf : compile sans la
      # feature `interface-tauri`, il ne demande plus que quatre bibliotheques, alsa comprise.
      - name: Dependances systeme (Linux)
        if: runner.os == 'Linux'
        # 15 min suffisent largement. Le plafond est la parce que cette etape s'est figee SIX
        # HEURES sur la v0.31.0 : `unattended-upgrades` tient le verrou dpkg au demarrage du
        # runner et apt attend indefiniment. D'ou aussi `Lock::Timeout` et les trois essais.
        timeout-minutes: 15
        run: |
          set -eux
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          export DEBIAN_FRONTEND=noninteractive
          apt_reessai() {
            for essai in 1 2 3; do
              if sudo apt-get -o DPkg::Lock::Timeout=120 "$@"; then return 0; fi
              echo "apt-get $1 : echec (essai $essai), nouvelle tentative dans 15 s"
              sleep 15
            done
            return 1
          }
          apt_reessai update
          # `libasound2-dev` : cpal (capture audio des reunions) depend d'`alsa-sys` sans
          # condition sous Linux, meme quand on ne se sert que du host PulseAudio.
          apt_reessai install -y --no-install-recommends libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
          # Cle fixe : le cache est reutilise d'une release a la suivante tant que
          # Cargo.lock ne bouge pas.
          shared-key: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Les garde-fous du projet tournent aussi en CI : une release ne doit jamais partir
      # depuis un etat qui ne passe pas les verifications.
      - name: Verification des types frontend
        run: npm run check

      # `--release` est volontaire : sans lui, cargo compile TOUT une premiere fois en debug
      # pour les tests, puis une seconde en release pour le binaire livre — deux profils,
      # aucun artefact partage. Aucun `debug_assert!` dans le code, donc rien n'est perdu.
      # **ON EPROUVE CE QU'ON LIVRE, PAS AUTRE CHOSE.** Avec les features par defaut, les
      # essais compilent Tauri et reclament gtk-3 sur le runner — que ce workflow n'installe
      # plus, justement parce que le binaire livre ne le demande pas. La 0.59.0 est tombee
      # la-dessus : `gdk-sys` introuvable a l'etape des tests, alors que le paquet, lui,
      # n'en a aucun besoin.
      - name: Tests Rust
        run: cargo test --release --manifest-path backend/Cargo.toml

      # Le binaire que la coquille lance : il n'ouvre aucune fenetre et ne reclame que
      # quatre bibliotheques. C'est le DERNIER build qui est empaquete, d'ou cette etape
      # juste avant l'empaquetage.
      - name: Backend
        env:
          # L'adresse du serveur de suivi est figee DANS le binaire a la compilation
          # (`option_env!`), pas ecrite dans le depot — il est public. Secrets absents = la
          # remontee est simplement inactive, ce qui est le cas des builds locaux.
          COCKPIT_GOOGLE_ID: ${{ secrets.COCKPIT_GOOGLE_ID }}
          COCKPIT_GOOGLE_SECRET: ${{ secrets.COCKPIT_GOOGLE_SECRET }}
          COCKPIT_REPORT_URL: ${{ secrets.COCKPIT_REPORT_URL }}
          COCKPIT_REPORT_SITE: ${{ secrets.COCKPIT_REPORT_SITE }}
          # Serveur maison sans certificat : le HTTP est assume ici, explicitement.
          COCKPIT_REPORT_ALLOW_HTTP: ${{ secrets.COCKPIT_REPORT_ALLOW_HTTP }}
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Interface
        run: npm run build

      # Les notes de version viennent du CHANGELOG.md : c'est ce texte que les utilisateurs
      # lisent dans le modal de mise a jour.
      - name: Extraire les notes du CHANGELOG
        id: notes
        # `shell: bash` explicite : le shell par defaut du runner Windows est PowerShell, qui
        # ne connait ni `${VAR#prefixe}` ni les heredocs. Git Bash est installe sur les images
        # `windows-*`, donc la MEME etape sert aux trois plateformes.
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::Aucune section [$VERSION] trouvee dans CHANGELOG.md — release interrompue."
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Dependances de la coquille
        working-directory: coquille
        run: npm ci

      # Empaquete et publie sur la MEME release que les autres plateformes. En BROUILLON :
      # les trois jobs y deposent leurs artefacts, et le premier a finir exposerait sinon une
      # release incomplete. Le job `publier` leve le brouillon quand Linux est bien la.
      - name: Empaqueter et publier
        working-directory: coquille
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas de compte developpeur Apple : on ne signe ni ne notarise, comme la version
          # precedente. Sans cette ligne, electron-builder cherche une identite et echoue.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: npx electron-builder --publish always

  # Leve le brouillon UNE FOIS la version Linux verifiee. Separe du build pour s'executer
  # meme si le job macOS a echoue : un echec la-bas ne doit pas priver les utilisateurs
  # Linux de leur mise a jour.
  publier:
    needs: [preparer, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verifier que la version Linux est publiable, puis lever le brouillon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Passage par l'API et non par `gh release view` : un brouillon n'est PAS
          # accessible par son tag (l'API rend 404), il faut le retrouver dans la liste.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" > /tmp/releases.json
          python3 - <<'EOF' > /tmp/brouillon.env
          import json, os, sys
          tag = os.environ["TAG"]
          releases = json.load(open("/tmp/releases.json"))
          cibles = [r for r in releases if r["tag_name"] == tag]
          if not cibles:
              sys.exit(f"::error::aucune release pour le tag {tag}")
          if len(cibles) > 1:
              sys.exit(f"::error::{len(cibles)} releases portent le tag {tag} — publication manuelle requise")
          r = cibles[0]
          noms = sorted(a["name"] for a in r["assets"])
          print(f"# artefacts : {noms}", file=sys.stderr)

          # Sans AppImage il n'y a rien a livrer a nos utilisateurs : mieux vaut laisser le
          # brouillon en place qu'annoncer une version qu'ils ne peuvent pas installer.
          if not any(n.endswith(".AppImage") for n in noms):
              sys.exit("::error::aucune AppImage : la release reste en brouillon")

          # Le manifeste que lit l'updater d'Electron. Sans lui, l'application cherche une
          # mise a jour et ne trouve rien — le 404 que la migration a deja fait voir.
          if "latest-linux.yml" not in noms:
              sys.exit("::error::latest-linux.yml absent : la release reste en brouillon")
          print(f"RELEASE_ID={r['id']}")
          print(f"DEJA_PUBLIEE={'0' if r['draft'] else '1'}")
          # **CE FICHIER EST EVALUE COMME DU SHELL.** Une valeur a espaces sans guillemets
          # fait prendre le deuxieme mot pour une commande — constate le 2026-09-10.
          print("NOMS=\"" + " ".join(noms) + "\"")
          EOF
          cat /tmp/brouillon.env >> "$GITHUB_ENV"
          . /tmp/brouillon.env

          if [ "$DEJA_PUBLIEE" = "1" ]; then
            echo "Release $TAG deja publiee, rien a faire."
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false -f make_latest=true > /dev/null
            echo "Release $TAG publiee : les utilisateurs peuvent mettre a jour."
          fi

          # **UNE PLATEFORME ABSENTE NE DOIT PAS PASSER INAPERCUE.** Sur la v0.32.0, le job
          # macOS avait echoue, le manifeste est sorti sans son entree, tous les utilisateurs
          # mac ont ete coupes des mises a jour, et le job est reste VERT. On publie quand
          # meme — les systemes qui ont reussi ne doivent pas attendre l'autre — puis on fait
          # ECHOUER le run en nommant ce qui manque. Ajouter une plateforme a la matrice =
          # l'ajouter ici, sinon son absence redevient silencieuse.
          export NOMS
          MANIFESTES="latest-linux.yml latest-mac.yml latest.yml" python3 - <<'EOF'
          import os, sys
          noms = set(os.environ["NOMS"].split())
          manquants = [m for m in os.environ["MANIFESTES"].split() if m not in noms]
          if manquants:
              print(f"::error::release publiee mais INCOMPLETE — manifestes absents : "
                    f"{', '.join(manquants)}. Ces utilisateurs ne recevront pas la mise a "
                    f"jour. Reparer en relancant le job de la plateforme concernee : "
                    f"electron-builder retrouve la release et y ajoute ce qui manque.")
              sys.exit(1)
          print(f"manifestes complets : {sorted(noms & set(os.environ['MANIFESTES'].split()))}")
          EOF
