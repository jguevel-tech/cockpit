name: Release

# Se declenche sur un tag v* pousse par un humain (le script de release cree le tag,
# il ne le pousse jamais). C'est le seul chemin de publication.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # necessaire pour creer la Release et y attacher les artefacts

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependances systeme Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Sauve le cache meme quand le job echoue : sans ca, chaque correctif de CI
          # repartait d'une compilation Rust complete (~11 min perdues par iteration).
          cache-on-failure: true

      - run: npm ci

      # Les garde-fous du projet tournent aussi en CI : une release ne doit jamais
      # partir depuis un etat qui ne passe pas les verifications.
      - name: Verification des types frontend
        run: npm run check

      # `--release` est volontaire : sans lui, cargo compile TOUT une premiere fois en debug
      # pour les tests, puis tauri-action recompile TOUT en release pour l'AppImage — deux
      # profils, aucun artefact partage. Mesure sur le run 31691474888 : 2 min 45 de tests
      # + 8 min 44 de build = ~12 min. En release, les deux etapes partagent le meme
      # target/release. Aucun `debug_assert!` dans le code, donc rien n'est perdu.
      - name: Tests Rust
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      # Les notes de version viennent du CHANGELOG.md, pas du message de commit : c'est ce
      # texte que les utilisateurs lisent dans le modal de mise a jour. On extrait la section
      # de la version taguee, delimitee par le titre suivant.
      - name: Extraire les notes du CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::Aucune section [$VERSION] trouvee dans CHANGELOG.md — release interrompue."
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Construit l'AppImage, le signe avec la cle privee, cree la Release GitHub
      # et publie latest.json (le manifeste que l'app interroge).
      - name: Build, signature et publication
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # La cle a ete generee SANS mot de passe : un seul secret a gerer, et rien de
          # sensible n'a besoin de transiter ailleurs que du fichier vers GitHub.
          # La variable doit exister quand meme (chaine vide), sinon la CLI la reclame.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # `bundle.active` est volontairement absent de tauri.conf.json : l'y mettre a true
          # ECRASE le --no-bundle de la CLI et casserait le build de dev local (il tenterait
          # de signer sans cle privee). Le bundle est donc force ici, explicitement.
          args: -b appimage
          tagName: ${{ github.ref_name }}
          releaseName: Cockpit ${{ github.ref_name }}
          # Section du CHANGELOG.md extraite a l'etape precedente : c'est exactement ce
          # texte que les utilisateurs voient dans le modal de mise a jour.
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
