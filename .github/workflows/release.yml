name: Release

run-name: Release · ${{ github.ref_name }}

# Se declenche sur un tag v* pousse par un humain (le script de release cree le tag,
# il ne le pousse jamais). C'est le seul chemin de publication.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # necessaire pour creer la Release et y attacher les artefacts

jobs:
  # **LA RELEASE SE CREE UNE SEULE FOIS, ICI, AVANT TOUTE CONSTRUCTION.** Chaque job de la
  # matrice demandait a electron-builder de publier ; quand deux d'entre eux finissaient dans
  # la meme seconde, chacun constatait « la release n'existe pas » et en creait une. Sur la
  # v0.59.2 : DEUX brouillons pour le meme tag, l'AppImage Linux perdue entre les deux, et le
  # job de publication qui refuse (a juste titre) de trancher. Les trois jobs se contentent
  # desormais de deposer leurs fichiers dans un brouillon qui existe deja.
  preparer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.creer.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Creer le brouillon de release et y poser les notes
        id: creer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          export VERSION
          # Les notes viennent du CHANGELOG : c'est ce texte que les gens lisent dans le modal
          # de mise a jour ET sur la page de la release. electron-builder, lui, cree une
          # release SANS notes : les 0.59.0 et 0.59.1 sont sorties avec une page blanche.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ -z "$(tr -d '[:space:]' < /tmp/notes.md)" ]; then
            echo "::error::Aucune section [$VERSION] trouvee dans CHANGELOG.md — release interrompue."
            exit 1
          fi

          # Un brouillon n'est pas accessible par son tag : on le cherche dans la liste. Cette
          # etape doit pouvoir se rejouer (relance d'un run), donc elle REUTILISE ce qui existe.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" > /tmp/releases.json
          COMPTE=$(python3 -c "
          import json, os
          tag = os.environ['TAG']
          print(len([r for r in json.load(open('/tmp/releases.json')) if r['tag_name'] == tag]))
          ")
          if [ "$COMPTE" -gt 1 ]; then
            echo "::error::$COMPTE releases portent deja le tag $TAG — menage manuel requis"
            exit 1
          fi
          # **ON NE RECHERCHE PAS UNE RELEASE QU'ON VIENT DE CREER : ON GARDE CE QUE LA
          # CREATION A RENDU.** Mesure du 2026-09-10 : six secondes apres un
          # `gh release create --draft`, la liste ne contenait toujours pas le brouillon.
          # La creation par l'API, elle, rend l'objet cree avec son identifiant.
          # Le corps passe par un fichier JSON : les notes sont multilignes et accentuees,
          # ce qu'un `-f body=...` en ligne de commande abime.
          if [ "$COMPTE" = "0" ]; then
            python3 -c "
          import json, os
          print(json.dumps({'tag_name': os.environ['TAG'], 'name': os.environ['VERSION'],
                            'draft': True, 'body': open('/tmp/notes.md').read()}))
            " > /tmp/creation.json
            ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" --input /tmp/creation.json --jq .id)
          else
            ID=$(python3 -c "
          import json, os
          tag = os.environ['TAG']
          print([r['id'] for r in json.load(open('/tmp/releases.json')) if r['tag_name'] == tag][0])
            ")
            python3 -c "
          import json
          print(json.dumps({'body': open('/tmp/notes.md').read()}))
            " > /tmp/corps.json
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" --input /tmp/corps.json > /dev/null
          fi
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::la creation de la release n'a rendu aucun identifiant pour $TAG"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "brouillon $ID pret pour $TAG"

  release:
    needs: preparer
    # Matrice Linux + macOS + Windows. `fail-fast: false` pour qu'un echec macOS ou Windows
    # ne prive jamais les utilisateurs Linux de leur version.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest # Apple Silicon (aarch64)
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    # Le build Rust a cache froid est long ; au-dela c'est un blocage, pas une lenteur.
    # Sans ce plafond GitHub attend SIX HEURES avant de tuer le job.
    # Windows a plus : une personne doit approuver deux demandes de signature chez SignPath,
    # et le job attend sa reponse.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 300 || 120 }}
    steps:
      - uses: actions/checkout@v4

      # **BEAUCOUP MOINS DE DEPENDANCES QU'AVANT, ET C'EST LE POINT DE TOUTE LA MIGRATION.**
      # Le backend ne reclame plus webkit2gtk, gtk-3, rsvg2 ni patchelf : compile sans la
      # feature `interface-tauri`, il ne demande plus que quatre bibliotheques, alsa comprise.
      - name: Dependances systeme (Linux)
        if: runner.os == 'Linux'
        # 15 min suffisent largement. Le plafond est la parce que cette etape s'est figee SIX
        # HEURES sur la v0.31.0 : `unattended-upgrades` tient le verrou dpkg au demarrage du
        # runner et apt attend indefiniment. D'ou aussi `Lock::Timeout` et les trois essais.
        timeout-minutes: 15
        run: |
          set -eux
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          export DEBIAN_FRONTEND=noninteractive
          apt_reessai() {
            for essai in 1 2 3; do
              if sudo apt-get -o DPkg::Lock::Timeout=120 "$@"; then return 0; fi
              echo "apt-get $1 : echec (essai $essai), nouvelle tentative dans 15 s"
              sleep 15
            done
            return 1
          }
          apt_reessai update
          # `libasound2-dev` : cpal (capture audio des reunions) depend d'`alsa-sys` sans
          # condition sous Linux, meme quand on ne se sert que du host PulseAudio.
          apt_reessai install -y --no-install-recommends libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
          # Cle fixe : le cache est reutilise d'une release a la suivante tant que
          # Cargo.lock ne bouge pas.
          shared-key: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Les garde-fous du projet tournent aussi en CI : une release ne doit jamais partir
      # depuis un etat qui ne passe pas les verifications.
      - name: Verification des types frontend
        run: npm run check

      # `--release` est volontaire : sans lui, cargo compile TOUT une premiere fois en debug
      # pour les tests, puis une seconde en release pour le binaire livre — deux profils,
      # aucun artefact partage. Aucun `debug_assert!` dans le code, donc rien n'est perdu.
      - name: Tests Rust
        run: cargo test --release --manifest-path backend/Cargo.toml

      # Le binaire que la coquille lance : il n'ouvre aucune fenetre et ne reclame que
      # quatre bibliotheques. C'est le DERNIER build qui est empaquete, d'ou cette etape
      # juste avant l'empaquetage.
      - name: Backend
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Interface
        run: npm run build

      # Les notes de version viennent du CHANGELOG.md : c'est ce texte que les utilisateurs
      # lisent dans le modal de mise a jour.
      - name: Extraire les notes du CHANGELOG
        id: notes
        # `shell: bash` explicite : le shell par defaut du runner Windows est PowerShell, qui
        # ne connait ni `${VAR#prefixe}` ni les heredocs. Git Bash est installe sur les images
        # `windows-*`, donc la MEME etape sert aux trois plateformes.
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::Aucune section [$VERSION] trouvee dans CHANGELOG.md — release interrompue."
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Dependances de la coquille
        working-directory: coquille
        run: npm ci

      # SignPath exige le nom du produit et la version sur chaque binaire qu'il signe, et cargo
      # n'en pose aucun. Fait meme sans signature : c'est ce que Windows affiche dans les
      # proprietes du fichier et le gestionnaire des taches.
      - name: Fiche du backend (Windows)
        if: runner.os == 'Windows'
        working-directory: coquille
        run: node outils/metadonnees-windows.js ../backend/target/release/cockpit.exe

      # **LA SIGNATURE WINDOWS NE PART QUE SI SIGNPATH EST CONFIGURE.** Les secrets ne se
      # lisent pas dans un `if:` : on les teste ici et on n'expose que la REPONSE aux etapes
      # suivantes. Le jeton lui-meme ne parait que dans les deux etapes SignPath : electron-
      # builder execute du code du depot et n'a pas a le voir.
      - name: Signature configuree ? (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          PRET: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          if [ "$PRET" = "true" ]; then
            echo "SIGNATURE=1" >> "$GITHUB_ENV"
            echo "signature SignPath configuree : construction en deux passes"
          else
            echo "::warning::SignPath n'est pas configure : la version Windows part NON SIGNEE, et le Controle intelligent des applications la bloquera."
          fi

      # **ON CONSTRUIT ICI, ON TELEVERSE A L'ETAPE SUIVANTE.** electron-builder sait publier
      # lui-meme, mais son client HTTP n'a AUCUN reessai : un fichier de 110 Mo qui depasse le
      # delai fait echouer tout le job, et la release reste incomplete. Constate deux fois de
      # suite (v0.76.0 cote macOS, v0.77.0 cote Linux) avec le meme « Request timed out ».
      - name: Empaqueter
        if: runner.os != 'Windows' || env.SIGNATURE != '1'
        working-directory: coquille
        env:
          # Pas de compte developpeur Apple : on ne signe ni ne notarise, comme la version
          # precedente. Sans cette ligne, electron-builder cherche une identite et echoue.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: npx electron-builder --publish never

      # **WINDOWS SIGNE, EN DEUX PASSES** (le detail est dans `coquille/outils/signature.js`).
      # Le Controle intelligent des applications refuse l'application des qu'UN fichier n'est
      # pas signe : l'installateur, mais aussi Cockpit.exe, le backend, chaque DLL et le
      # programme de desinstallation. Premiere passe : l'application, sans installateur utile.
      - name: Empaqueter sans signer (Windows, passe 1)
        if: runner.os == 'Windows' && env.SIGNATURE == '1'
        working-directory: coquille
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          COCKPIT_SIGNATURE_ETAPE: capturer
          COCKPIT_SIGNATURE_DOSSIER: ${{ github.workspace }}/coquille/signature/a-signer
        run: |
          set -euo pipefail
          npx electron-builder --win --publish never
          test -f signature/a-signer/desinstallation.exe
          mv paquet/win-unpacked signature/a-signer/win-unpacked
          # L'installateur de cette passe enferme des fichiers non signes : il ne doit partir
          # nulle part.
          rm -rf paquet

      - name: Envoyer l'application a signer
        id: a-signer
        if: runner.os == 'Windows' && env.SIGNATURE == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-application-a-signer
          path: coquille/signature/a-signer/
          retention-days: 1

      # Epingle sur un commit et non sur `v3` : cette etape detient le jeton SignPath, et une
      # etiquette deplacee pourrait le lire. Changer de version = relire le nouveau commit.
      - name: Signer l'application (SignPath)
        if: runner.os == 'Windows' && env.SIGNATURE == '1'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: cockpit
          signing-policy-slug: release-signing
          artifact-configuration-slug: application
          github-artifact-id: ${{ steps.a-signer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: "7200"
          output-artifact-directory: coquille/signature/signe

      # Seconde passe : l'installateur autour des fichiers SIGNES, sans rien y retoucher
      # (`--prepackaged` ne modifie pas les binaires, ce qui casserait leur signature).
      - name: Fabriquer l'installateur (Windows, passe 2)
        if: runner.os == 'Windows' && env.SIGNATURE == '1'
        working-directory: coquille
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          COCKPIT_SIGNATURE_ETAPE: remplacer
          COCKPIT_SIGNATURE_DOSSIER: ${{ github.workspace }}/coquille/signature/signe
        run: |
          set -euo pipefail
          npx electron-builder --win --prepackaged signature/signe/win-unpacked --publish never
          mkdir -p signature/installateur
          cp paquet/*.exe signature/installateur/

      - name: Envoyer l'installateur a signer
        id: installateur-a-signer
        if: runner.os == 'Windows' && env.SIGNATURE == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installateur-a-signer
          path: coquille/signature/installateur/
          retention-days: 1

      - name: Signer l'installateur (SignPath)
        if: runner.os == 'Windows' && env.SIGNATURE == '1'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: cockpit
          signing-policy-slug: release-signing
          artifact-configuration-slug: installateur
          github-artifact-id: ${{ steps.installateur-a-signer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: "7200"
          output-artifact-directory: coquille/signature/installateur-signe

      - name: Poser l'installateur signe et refaire le manifeste
        if: runner.os == 'Windows' && env.SIGNATURE == '1'
        working-directory: coquille
        shell: bash
        run: |
          set -euo pipefail
          cp signature/installateur-signe/*.exe paquet/
          node outils/manifeste-windows.js paquet

      # **UNE SIGNATURE SE VERIFIE AVANT DE PARTIR.** Un seul fichier non signe et
      # l'application est bloquee chez l'utilisateur : on refuse de deposer quoi que ce soit
      # tant que chaque binaire n'est pas valide.
      - name: Verifier les signatures (Windows)
        if: runner.os == 'Windows' && env.SIGNATURE == '1'
        working-directory: coquille
        shell: pwsh
        run: |
          $fichiers = @(Get-ChildItem signature/signe -Recurse -File -Include *.exe,*.dll,*.node)
          $fichiers += @(Get-ChildItem paquet -File -Filter *.exe)
          if ($fichiers.Count -lt 3) { Write-Host "::error::trop peu de binaires trouves ($($fichiers.Count))"; exit 1 }
          $rates = 0
          foreach ($f in $fichiers) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::$($f.Name) : $($sig.Status) $($sig.StatusMessage)"
              $rates++
            } else {
              Write-Host "$($f.Name) : signe par $($sig.SignerCertificate.Subject)"
            }
          }
          if ($rates -gt 0) { Write-Host "::error::$rates fichier(s) sans signature valide : rien ne part"; exit 1 }
          Write-Host "$($fichiers.Count) binaires signes"

      # Depose les artefacts sur la MEME release que les autres plateformes, en BROUILLON :
      # le premier job a finir exposerait sinon une release incomplete. Le job `publier` leve
      # le brouillon quand Linux est bien la.
      - name: Deposer les artefacts sur le brouillon
        working-directory: coquille
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          # **UN BINAIRE PORTE LE NOM QUE SON MANIFESTE ANNONCE.** electron-builder ecrit
          # « Cockpit Setup 0.78.0.exe » sur le disque, avec des espaces, mais son manifeste
          # designe « Cockpit-Setup-0.78.0.exe ». Depose tel quel, GitHub remplace les espaces
          # par des POINTS : l'asset existe, le manifeste pointe ailleurs, et la mise a jour
          # Windows ne trouve rien. On renomme donc avant d'envoyer.
          for fichier in paquet/*\ *; do
            [ -e "$fichier" ] || continue
            propre="$(printf '%s' "$fichier" | tr ' ' '-')"
            mv "$fichier" "$propre"
            echo "renomme : $(basename "$fichier") -> $(basename "$propre")"
          done

          # **LES MANIFESTES PARTENT EN DERNIER.** `latest*.yml` designe un binaire par son
          # empreinte : publie avant lui, il annonce une mise a jour qu'on ne peut pas encore
          # telecharger.
          # **PAS DE `mapfile` ICI : macOS EST EN BASH 3.2** et ne le connait pas. Le job y
          # est tombe en « command not found » apres avoir tout construit, donc sans deposer
          # un seul fichier. Une boucle `read` marche partout.
          BINAIRES=()
          while IFS= read -r fichier; do BINAIRES+=("$fichier"); done < <(
            find paquet -maxdepth 1 -type f \
              \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
                 -o -name '*.blockmap' \) | sort)
          MANIFESTES=()
          while IFS= read -r fichier; do MANIFESTES+=("$fichier"); done < <(
            find paquet -maxdepth 1 -type f -name 'latest*.yml' | sort)

          if [ "${#BINAIRES[@]}" -eq 0 ]; then
            echo "::error::aucun binaire construit — rien a deposer."
            exit 1
          fi

          # Trois tentatives espacees : un televersement qui depasse le delai reussit souvent
          # au coup suivant, et rater la release entiere pour ca coute une version.
          televerser() {
            local fichier="$1"
            for essai in 1 2 3; do
              if gh release upload "$TAG" "$fichier" --clobber; then
                return 0
              fi
              echo "::warning::televersement de $(basename "$fichier") en echec (essai $essai/3)"
              sleep $((essai * 20))
            done
            echo "::error::$(basename "$fichier") n'a pas pu etre depose apres trois tentatives."
            return 1
          }

          for fichier in "${BINAIRES[@]}" "${MANIFESTES[@]}"; do
            echo "depot de $(basename "$fichier")"
            televerser "$fichier"
          done

  # Leve le brouillon UNE FOIS la version Linux verifiee. Separe du build pour s'executer
  # meme si le job macOS a echoue : un echec la-bas ne doit pas priver les utilisateurs
  # Linux de leur mise a jour.
  publier:
    needs: [preparer, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verifier que la version Linux est publiable, puis lever le brouillon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Passage par l'API et non par `gh release view` : un brouillon n'est PAS
          # accessible par son tag (l'API rend 404), il faut le retrouver dans la liste.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" > /tmp/releases.json
          python3 - <<'EOF' > /tmp/brouillon.env
          import json, os, sys
          tag = os.environ["TAG"]
          releases = json.load(open("/tmp/releases.json"))
          cibles = [r for r in releases if r["tag_name"] == tag]
          if not cibles:
              sys.exit(f"::error::aucune release pour le tag {tag}")
          if len(cibles) > 1:
              sys.exit(f"::error::{len(cibles)} releases portent le tag {tag} — publication manuelle requise")
          r = cibles[0]
          noms = sorted(a["name"] for a in r["assets"])
          print(f"# artefacts : {noms}", file=sys.stderr)

          # Sans AppImage il n'y a rien a livrer a nos utilisateurs : mieux vaut laisser le
          # brouillon en place qu'annoncer une version qu'ils ne peuvent pas installer.
          if not any(n.endswith(".AppImage") for n in noms):
              sys.exit("::error::aucune AppImage : la release reste en brouillon")

          # Le manifeste que lit l'updater d'Electron. Sans lui, l'application cherche une
          # mise a jour et ne trouve rien — le 404 que la migration a deja fait voir.
          if "latest-linux.yml" not in noms:
              sys.exit("::error::latest-linux.yml absent : la release reste en brouillon")
          print(f"RELEASE_ID={r['id']}")
          print(f"DEJA_PUBLIEE={'0' if r['draft'] else '1'}")
          # **CE FICHIER EST EVALUE COMME DU SHELL.** Une valeur a espaces sans guillemets
          # fait prendre le deuxieme mot pour une commande — constate le 2026-09-10.
          print("NOMS=\"" + " ".join(noms) + "\"")
          EOF
          cat /tmp/brouillon.env >> "$GITHUB_ENV"
          . /tmp/brouillon.env

          if [ "$DEJA_PUBLIEE" = "1" ]; then
            echo "Release $TAG deja publiee, rien a faire."
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false -f make_latest=true > /dev/null
            echo "Release $TAG publiee : les utilisateurs peuvent mettre a jour."
          fi

          # **UNE PLATEFORME ABSENTE NE DOIT PAS PASSER INAPERCUE.** Sur la v0.32.0, le job
          # macOS avait echoue, le manifeste est sorti sans son entree, tous les utilisateurs
          # mac ont ete coupes des mises a jour, et le job est reste VERT. On publie quand
          # meme — les systemes qui ont reussi ne doivent pas attendre l'autre — puis on fait
          # ECHOUER le run en nommant ce qui manque. Ajouter une plateforme a la matrice =
          # l'ajouter ici, sinon son absence redevient silencieuse.
          export NOMS TAG
          MANIFESTES="latest-linux.yml latest-mac.yml latest.yml" python3 - <<'EOF'
          import os, subprocess, sys
          noms = set(os.environ["NOMS"].split())
          attendus = os.environ["MANIFESTES"].split()
          manquants = [m for m in attendus if m not in noms]
          if manquants:
              print(f"::error::release publiee mais INCOMPLETE — manifestes absents : "
                    f"{', '.join(manquants)}. Ces utilisateurs ne recevront pas la mise a "
                    f"jour. Reparer en relancant le job de la plateforme concernee.")
              sys.exit(1)

          # **UN MANIFESTE QUI DESIGNE UN FICHIER ABSENT EST PIRE QU'UN MANIFESTE MANQUANT** :
          # l'application annonce la mise a jour, puis echoue au telechargement. Vu sur la
          # v0.77.1 — le manifeste Windows nommait « Cockpit-Setup-0.77.1.exe » quand l'asset
          # depose s'appelait « Cockpit.Setup.0.77.1.exe », GitHub ayant remplace les espaces
          # du nom de fichier par des points.
          # **CE JOB NE CLONE PAS LE DEPOT** : `gh` ne peut pas deviner sur lequel travailler,
          # d'ou `--repo`. Sans lui, la commande echoue et on ne sait pas pourquoi — son
          # stderr est donc repris tel quel dans le message.
          rate = []
          for manifeste in attendus:
              lu = subprocess.run(
                  ["gh", "release", "download", os.environ["TAG"],
                   "--repo", os.environ["GITHUB_REPOSITORY"],
                   "--pattern", manifeste, "--output", "-"],
                  capture_output=True, text=True)
              if lu.returncode != 0:
                  print(f"::error::{manifeste} illisible : {lu.stderr.strip()[:200]}")
                  sys.exit(1)
              texte = lu.stdout
              for ligne in texte.splitlines():
                  ligne = ligne.strip()
                  if ligne.startswith("- url:") or ligne.startswith("url:"):
                      cible = ligne.split(":", 1)[1].strip()
                      if cible and cible not in noms:
                          rate.append(f"{manifeste} designe {cible}, absent de la release")
          if rate:
              print("::error::manifeste et artefacts ne correspondent pas : " + " ; ".join(rate))
              sys.exit(1)
          print(f"manifestes complets et coherents : {sorted(set(attendus))}")
          EOF
