# Les essais sur les systemes qu'on ne peut pas exercer en local, AVANT de taguer.
#
# Pourquoi ce fichier existe : deux versions de suite sont parties incompletes parce qu'un
# essai ne tombait que sur macOS (v0.38.0 et v0.39.0). On ne l'apprenait qu'apres le tag,
# donc apres publication — et chaque tentative coutait une version aux utilisateurs. Ici on
# le sait avant, gratuitement, autant de fois qu'il faut.
#
# Rien n'est publie : la Release, la signature et `latest.json` restent l'affaire de
# `release.yml`. Le seul produit est l'installeur Windows, en artefact, pour l'essayer a la
# main.
#
# Usage : `gh workflow run essais.yml`, puis `gh run watch`.
name: Essais (macOS et Windows)

on:
  workflow_dispatch:

jobs:
  essais:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Meme cle que la release : les deux partagent le meme `target/`, sinon chaque
          # essai repart d'une compilation complete.
          shared-key: tauri
          cache-on-failure: true

      - run: npm ci

      - name: Verification des types frontend
        run: npm run check

      # `--release`, comme dans `release.yml` : c'est le meme profil, donc le meme cache et
      # le meme comportement. Des essais en debug ne prouveraient pas la meme chose.
      - name: Tests Rust
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      # Windows seulement : c'est le seul systeme dont on veut un installeur a essayer a la
      # main. macOS est deja livre par `release.yml`.
      - name: Construction de l'installeur Windows
        if: runner.os == 'Windows'
        # La cle de signature est NECESSAIRE meme ici : `tauri.conf.json` porte la cle
        # PUBLIQUE de l'updater, donc la CLI reclame la privee et echoue apres avoir produit
        # l'installeur (« A public key has been found, but no private key »). Sans ces deux
        # variables, le banc rend rouge un essai qui a pourtant tout reussi — c'est arrive au
        # premier passage, et ca fait chercher un probleme la ou il n'y en a pas.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # La cle a ete generee sans mot de passe, mais la variable doit exister.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build -b nsis

      - name: Recuperer l'installeur Windows
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
