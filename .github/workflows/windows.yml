# L'atelier Windows. Rien ici ne publie : il produit un installeur en ARTEFACT, a
# telecharger depuis la page du run.
#
# Pourquoi separe de `release.yml` : le portage compile sans un avertissement mais ne
# fonctionne pas encore (ecriture dans le PTY en « os error 0 », creation de session en
# « handle invalide » — mesures du runner de la v0.38.0). Le garder dans la matrice de
# release voudrait dire soit publier un installeur dont les terminaux sont morts, soit une
# release rouge a chaque version, ce qui rend invisible le jour ou l'echec est une vraie
# regression.
#
# `on: workflow_dispatch` : `gh workflow run windows.yml`. Les essais tournent meme s'ils
# echouent (`continue-on-error`), parce que c'est LEUR SORTIE qu'on vient chercher, et le
# bundle est tente ensuite : un installeur qui s'ouvre, meme avec des terminaux casses,
# permet de voir tout le reste de l'application.
name: Windows (atelier)

on:
  workflow_dispatch:

jobs:
  essai:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Meme cle que la release : les deux partagent le meme `target/`.
          shared-key: tauri
          cache-on-failure: true

      - run: npm ci

      - name: Verification des types frontend
        run: npm run check

      # Ce qu'on vient chercher. `continue-on-error` : un echec ici ne doit pas empecher
      # l'etape suivante de produire un installeur a essayer.
      - name: Tests Rust
        continue-on-error: true
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Construction de l'installeur
        continue-on-error: true
        run: npx tauri build -b nsis

      - name: Recuperer l'installeur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
